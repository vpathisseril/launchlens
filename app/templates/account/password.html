{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block body %}
<main id="main" class="auth-wrap">
  <div class="card">
    <h2>Change password</h2>
    {% if user.must_change_password %}<div class="alert warn">For security, set a new password before continuing.</div><br>{% endif %}
    {% if error %}<div class="alert err">{{ error }}</div><br>{% endif %}
    <form method="post" action="/account/password">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div class="field"><label for="current">Current password</label><input id="current" name="current" type="password" required autocomplete="current-password"></div>
      <div class="field"><label for="new">New password</label><input id="new" name="new" type="password" required minlength="12" autocomplete="new-password"></div>
      <button class="btn primary"><i data-lucide="check"></i>Update password</button>
    </form>
  </div>
</main>
{% endblock %}
