{% extends "app_shell.html" %}
{% block title %}Modules{% endblock %}
{% block content %}
<div class="page-head"><div><div class="eyebrow">Admin</div><h1>Modules</h1><p>Turn hubs on or off platform-wide and choose which ones are granted automatically on approval.</p></div></div>
<div class="grid g3">
{% for m in rows %}
  <form method="post" action="/admin/modules/{{ m.id }}" class="card"><input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="card-head"><h3><i data-lucide="{{ m.icon }}"></i>{{ m.key }}</h3></div>
    <div class="field"><label>Name</label><input type="text" name="name" value="{{ m.name }}"></div>
    <div class="field"><label>Description</label><input type="text" name="description" value="{{ m.description }}"></div>
    <div class="grid g2"><div class="field"><label>Icon (Lucide)</label><input type="text" name="icon" value="{{ m.icon }}"></div>
      <div class="field"><label>Order</label><input type="number" name="sort_order" value="{{ m.sort_order }}"></div></div>
    <label class="check"><input type="checkbox" name="is_active" {{ 'checked' if m.is_active }}>Active</label>
    <label class="check"><input type="checkbox" name="is_default" {{ 'checked' if m.is_default_on_approval }}>Grant on approval</label><br>
    <button class="btn sm primary"><i data-lucide="save"></i>Save</button>
  </form>
{% endfor %}
</div>
{% endblock %}
