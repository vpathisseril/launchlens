{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block body %}
<main id="main" class="auth-wrap">
  <div class="card">
    <h2>Sign in</h2>
    {% if request.query_params.get('reset') %}<div class="alert ok">Password updated. Sign in with your new password.</div><br>{% endif %}
    {% if error %}<div class="alert err" role="alert"><i data-lucide="alert-circle"></i>{{ error }}</div><br>{% endif %}
    <form method="post" action="/login">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="next" value="{{ next }}">
      <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" required autocomplete="username"></div>
      <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" required autocomplete="current-password"></div>
      <button class="btn primary lg" style="width:100%;justify-content:center"><i data-lucide="log-in"></i>Sign in</button>
    </form>
    <p class="small muted" style="margin-top:14px"><a href="/forgot">Forgot password?</a> · <a href="/signup">Request access</a></p>
  </div>
</main>
{% endblock %}
