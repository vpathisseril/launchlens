{% extends "base.html" %}
{% block title %}Reset password{% endblock %}
{% block body %}
<main id="main" class="auth-wrap">
  <div class="card">
    <h2>Reset password</h2>
    {% if sent %}<div class="alert ok">If an account exists for that email, a reset link valid for 30 minutes is on its way.</div>
    {% else %}
    <form method="post" action="/forgot">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" required></div>
      <button class="btn primary"><i data-lucide="mail"></i>Send reset link</button>
    </form>{% endif %}
  </div>
</main>
{% endblock %}
