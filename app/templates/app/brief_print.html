<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ p.title }} — Executive Brief v{{ b.version }}</title>
<link rel="stylesheet" href="/static/themes/clinical-clean.css"><link rel="stylesheet" href="/static/css/app.css">
</head>
<body data-theme="clinical-clean" style="background:#EEF2F7">
<div class="no-print row" style="justify-content:center;padding:14px">
  <a class="btn" href="/projects/{{ p.id }}">← Back to project</a>
  <button class="btn primary" id="print-btn">Print / Save as PDF</button>
  <a class="btn" href="/briefs/{{ b.id }}.md">Download .md</a>
</div>
<article class="print-page prose card" data-theme="clinical-clean">
  <div class="row" style="justify-content:space-between;margin-bottom:8px">
    <span class="brand" style="color:#0F172A"><span class="logo" style="width:24px;height:24px"></span>LaunchLens <span class="badge-vp">VP+AI</span></span>
    <span class="tiny muted">Brief v{{ b.version }} · {{ b.created_at.strftime('%B %d, %Y') }}</span>
  </div>
  {{ b.content_md|md|safe }}
</article>
<script nonce="{{ request.state.nonce }}">document.getElementById("print-btn").addEventListener("click",()=>window.print());</script>
</body></html>
